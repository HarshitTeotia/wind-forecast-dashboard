services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; r = urlopen('http://127.0.0.1:8000/api/health', timeout=3); assert r.status == 200 and json.load(r)['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
